name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMake version
        run: |
          # Git tags are vX.Y.Z; CMake project() uses X.Y.Z without the prefix.
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^project(glance-mde VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$cmake_version" ]; then
            echo "Could not read project version from CMakeLists.txt"
            exit 1
          fi
          echo "Git tag: ${GITHUB_REF_NAME} -> version ${tag_version}"
          echo "CMake VERSION: ${cmake_version}"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMake VERSION ${cmake_version}."
            echo "Bump project(glance-mde VERSION ${tag_version}) in CMakeLists.txt, commit that, then retag that commit as ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libwxgtk3.2-dev \
            libwxgtk-webview3.2-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t packages < <(find build -maxdepth 1 -name '*.deb' | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No Debian package was produced"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "Glance ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${packages[@]}"
